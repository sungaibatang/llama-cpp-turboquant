name: Build Windows Vulkan (.exe)

on:
  workflow_dispatch: # Memunculkan tombol "Run Workflow" manual

jobs:
  build-vulkan:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install Vulkan SDK
      run: |
        choco install vulkan-sdk -y
        echo "VULKAN_SDK=C:\VulkanSDK" >> $GITHUB_ENV

    - name: Configure CMake
      run: |
        cmake -B build -G "Visual Studio 17 2022" -A x64 -DGGML_VULKAN=ON -DCMAKE_BUILD_TYPE=Release

    - name: Build llama.cpp
      run: |
        cmake --build build --config Release --parallel

    - name: Upload Artifacts (Download Hasil Build)
      uses: actions/upload-artifact@v4
      with:
        name: llama-cpp-vulkan-win64
        path: |
          build/bin/Release/*.exe
