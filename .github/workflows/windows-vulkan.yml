name: Build Windows Vulkan (.exe)

on:
  workflow_dispatch:

jobs:
  build-vulkan:
    runs-on: windows-2022 # Mengunci versi OS agar lebih stabil

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Vulkan SDK
      run: |
        # Mengunduh dan memasang Vulkan SDK secara senyap (silent install)
        curl -L -o vulkan-sdk-installer.exe https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe
        start-process -FilePath .\vulkan-sdk-installer.exe -ArgumentList "--default-answer", "--accept-licenses", "--confirm-command", "install" -Wait
        
        # Memastikan Environment Variable terpasang di sesi ini
        echo "VULKAN_SDK=C:\VulkanSDK" >> $GITHUB_ENV
        echo "C:\VulkanSDK\Bin" >> $GITHUB_PATH

    - name: Configure CMake
      run: |
        # Membuat folder build dan konfigurasi dengan mengarahkan manual ke Vulkan SDK
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DGGML_VULKAN=ON `
          -DCMAKE_BUILD_TYPE=Release `
          -DVulkan_DIR="C:/VulkanSDK/lib/cmake/Vulkan"

    - name: Build llama.cpp
      run: |
        cmake --build build --config Release --parallel

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: llama-cpp-vulkan-win64
        path: |
          build/bin/Release/*.exe
