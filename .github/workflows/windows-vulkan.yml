name: Build Windows Vulkan (.exe)

on:
  workflow_dispatch: # Memunculkan tombol hijau manual

jobs:
  build-windows-vulkan:
    runs-on: windows-2022

    steps:
    - name: Clone Repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Get Latest Vulkan SDK Version (From LunarG)
      shell: powershell
      id: get_vulkan_version
      run: |
        # Mengambil nomor versi terbaru secara dinamis dari server LunarG seperti skrip asli
        $version = (Invoke-WebRequest -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Content.Trim()
        echo "VULKAN_VERSION=$version" >> $env:GITHUB_ENV
        echo "Mendeteksi Vulkan SDK versi: $version"

    - name: Install Vulkan SDK via Chocolatey
      shell: powershell
      run: |
        # Mengunci instalasi sesuai versi dinamis yang didapatkan di atas
        choco install vulkan-sdk --version "${{ env.VULKAN_VERSION }}" -y --no-progress
        
        # Mendaftarkan path ke environment variable runner secara permanen
        echo "VULKAN_SDK=C:\VulkanSDK\${{ env.VULKAN_VERSION }}" >> $env:GITHUB_ENV
        echo "C:\VulkanSDK\${{ env.VULKAN_VERSION }}\Bin" >> $env:GITHUB_PATH

    - name: Configure CMake (Sesuai Standar TurboQuant)
      shell: powershell
      run: |
        # Menjalankan konfigurasi CMake dengan flag optimal dari Dockerfile & CI asli
        cmake -B build -G "Visual Studio 17 2022" -A x64 `
          -DGGML_NATIVE=OFF `
          -DGGML_VULKAN=ON `
          -DLLAMA_BUILD_TESTS=OFF `
          -DGGML_BACKEND_DL=ON `
          -DGGML_CPU_ALL_VARIANTS=ON `
          -DCMAKE_BUILD_TYPE=Release

    - name: Build Project
      run: |
        cmake --build build --config Release --parallel

    - name: Pack and Upload Artifacts (.exe & .dll)
      uses: actions/upload-artifact@v4
      with:
        name: llama-cpp-turboquant-vulkan-win64
        path: |
          build/bin/Release/*.exe
          build/bin/Release/*.dll
